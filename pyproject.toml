[project]
name = "data-project"
version = "0.1.0"
description = "One-line description of what this project does and for whom."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Soumyajeet Addya" }]
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_project"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# SIM simplifications, N naming, S security, PT pytest style, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=data_project --cov-report=term-missing"
markers = [
    "integration: needs real services (network, Docker); skipped in the default run",
]

[tool.coverage.report]
skip_empty = true
